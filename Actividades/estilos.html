<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo de estilo en columnas</title>
  <style>
    table {
      border-collapse: collapse;
      width: 50%;
      margin: 20px auto;
    }

    th, td {
      border: 1px solid #333;
      padding: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Tabla con estilo común en columnas</h1>

  <table>
    <colgroup>
      <col> <!-- Primera columna sin estilo -->
      <col style="background-color: yellow"> <!-- Segunda columna con fondo amarillo -->
    </colgroup>
    <tr>
      <th>Dato 1</th>
      <th>Dato 2</th>
    </tr>
    <tr>
      <td>Calcuta</td>
      <td>Pizza</td>
    </tr>
    <tr>
      <td>Robots</td>
      <td>Jazz</td>
    </tr>
  </table>
</body>
</html>
