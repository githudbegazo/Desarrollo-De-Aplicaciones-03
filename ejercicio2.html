<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Registro</title>
  <style>
    form {
      margin: 0 auto;
      width: 400px;
      padding: 1em;
      border: 1px solid #CCC;
      border-radius: 1em;
      font-family: Arial, sans-serif;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    form li + li {
      margin-top: 1em;
    }

    label {
      display: inline-block;
      width: 120px;
      text-align: right;
    }

    input, textarea {
      font: 1em sans-serif;
      width: 250px;
      box-sizing: border-box;
      border: 1px solid #999;
      border-radius: 4px;
      padding: 5px;
    }

    input:focus, textarea:focus {
      border-color: #000;
    }

    textarea {
      vertical-align: top;
      height: 5em;
    }

    .button {
      padding-left: 120px;
    }

    button {
      margin-left: .5em;
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Formulario de Registro</h1>

  <form action="/registrar" method="post">
    <ul>
      <li>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="user_name" 
               required minlength="3" maxlength="30"
               pattern="[A-Za-zÁÉÍÓÚáéíóú\s]+"
               title="Solo letras y espacios, mínimo 3 caracteres.">
      </li>

      <li>
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="user_email" 
               required title="Introduce un correo válido.">
      </li>

      <li>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="user_password"
               required minlength="6" maxlength="12"
               pattern="^(?=.*[A-Z])(?=.*[0-9]).{6,12}$"
               title="Debe tener entre 6 y 12 caracteres, incluir al menos una mayúscula y un número.">
      </li>

      <li>
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="user_message"
                  minlength="10" maxlength="200"
                  placeholder="Escribe tu mensaje aquí..."></textarea>
      </li>

      <li class="button">
        <button type="submit">Registrarse</button>
      </li>
    </ul>
  </form>
</body>
</html>
