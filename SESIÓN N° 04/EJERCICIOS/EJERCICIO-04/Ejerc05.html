<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline de transformaciones</title>
</head>

<body>

    <h1>Pipeline de transformaciones</h1>

    <label for="numero">Ingrese un número:</label>
    <input type="number" id="numero" value="5">

    <button onclick="ejecutarPipelines()">Ejecutar pipelines</button>

    <h2>Resultados</h2>

    <p>
        Pipeline 1 (duplicar, sumar diez y elevar al cuadrado):
        <strong id="resultado1"></strong>
    </p>

    <p>
        Pipeline 2 (elevar al cuadrado, duplicar y sumar diez):
        <strong id="resultado2"></strong>
    </p>
    <p>
        Pipeline 3 (sumar diez, elevar al cuadrado y duplicar):
        <strong id="resultado3"></strong>
    </p>
    <p>
        Pipeline 4 (restar cinco, duplicar y elevar al cuadrado):
        <strong id="resultado4"></strong>
    </p>

    <script>
        // Función pipeline
        function pipeline(...transformaciones) {
            return function(valorInicial) {
                return transformaciones.reduce(
                    (resultado, transformar) => transformar(resultado),
                    valorInicial
                );
            };
        }

        // Transformaciones
        const duplicar = n => n * 2;
        const sumarDiez = n => n + 10;
        const cuadrado = n => n ** 2;
        const restarCinco = n => n - 5;

        // Pipeline 1
        const operacion1 = pipeline(
            duplicar,
            sumarDiez,
            cuadrado
        );

        // Pipeline 2
        const operacion2 = pipeline(
            cuadrado,
            duplicar,
            sumarDiez
        );
        //Pipeline 3
        const operacion3 = pipeline(
            sumarDiez,
            cuadrado,
            duplicar
        );
        //Pipeline 4
        const operacion4 = pipeline(
            restarCinco,
            duplicar,
            cuadrado
        );

        function ejecutarPipelines() {
            const numero = Number(document.getElementById("numero").value);

            const resultado1 = operacion1(numero);
            const resultado2 = operacion2(numero);
            //agrgamos 2 mas difeerentes 
            const resultado3 = operacion3(numero);
            const resultado4 = operacion4(numero);

            document.getElementById("resultado1").textContent = resultado1;
            document.getElementById("resultado2").textContent = resultado2;
            document.getElementById("resultado3").textContent = resultado3;
            document.getElementById("resultado4").textContent = resultado4;
        }

        // Ejecuta los pipelines al cargar la página
        ejecutarPipelines();
    </script>

</body>
</html>
