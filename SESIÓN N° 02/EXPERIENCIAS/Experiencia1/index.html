<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Recetaria</title>
</head>
<!-- Página principal de la recetaria usando  css en linea -->
<body style="font-family: Arial; background:#fff4e6;">

    <header style="background:#d35400; color:white; padding:10px;">
        <h1>Mi Recetaria</h1>
    </header>

    <nav style="margin:10px;">
        <a href="#receta">Receta</a> |
        <a href="#contacto">Contacto</a>
    </nav>

    <main>
        <section id="receta" style="background:white; padding:15px;">
            <article>
                <h2>Panqueques</h2>

                <div style="color:#555;">
                    <span>Tiempo: 15 minutos</span>
                </div>

                <h3>Ingredientes</h3>
                <ul>
                    <li>1 taza de harina</li>
                    <li>1 huevo</li>
                    <li>1 taza de leche</li>
                    <li>Azúcar</li>
                </ul>

                <h3>Preparación</h3>
                <p>Mezclar los ingredientes y cocinar en una sartén.</p>
            </article>
        </section>

        <aside style="background:#ffe0b2; padding:10px;">
            Consejo: acompaña los panqueques con fruta.
        </aside>
    </main>

    <footer id="contacto" style="text-align:center; margin-top:20px;">
        <p>Recetaria 2026</p>
    </footer>

</body>
</html>
