<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS por ID</title>
    <link rel="stylesheet" href="id.css">
</head>

<body id="pagina">

    <header id="cabecera">
        <h1 id="titulo">Mi Recetaria</h1>
    </header>

    <main id="contenido">
        <section id="receta">
            <h2 id="nombre-receta">Panqueques</h2>
            <p id="descripcion">Una receta fácil y rápida.</p>

            <h3 id="titulo-ingredientes">Ingredientes</h3>
            <ul id="ingredientes">
                <li>Harina</li>
                <li>Huevo</li>
                <li>Leche</li>
                <li>Azúcar</li>
            </ul>

            <h3 id="titulo-preparacion">Preparación</h3>
            <p id="preparacion">
                Mezclar los ingredientes y cocinar en una sartén.
            </p>
        </section>
    </main>

    <footer id="pie">
        <p>Mi Recetaria 2026</p>
    </footer>

</body>
</html>
