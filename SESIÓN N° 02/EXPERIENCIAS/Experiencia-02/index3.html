<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS por clase</title>
    <link rel="stylesheet" href="clase.css">
</head>

<body class="pagina">

    <header class="cabecera">
        <h1 class="titulo">Mi Recetaria</h1>
    </header>

    <main class="contenido">
        <section class="receta">
            <h2 class="subtitulo">Panqueques</h2>
            <p class="parrafo">Una receta fácil y rápida.</p>

            <h3 class="subtitulo">Ingredientes</h3>
            <ul class="lista">
                <li>Harina</li>
                <li>Huevo</li>
                <li>Leche</li>
                <li>Azúcar</li>
            </ul>

            <h3 class="subtitulo">Preparación</h3>
            <p class="parrafo">
                Mezclar los ingredientes y cocinar en una sartén.
            </p>
        </section>
    </main>

    <footer class="pie">
        <p>Mi Recetaria 2026</p>
    </footer>

</body>
</html>
