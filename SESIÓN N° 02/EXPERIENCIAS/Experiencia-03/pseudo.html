<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudoclases CSS</title>
    <link rel="stylesheet" href="pseudoclases.css">
</head>

<body>

    <h1>Mi Recetaria</h1>

    <nav>
        <a href="#receta">Receta</a>
        <a href="#contacto">Contacto</a>
    </nav>

    <main id="receta">
        <h2>Panqueques</h2>

        <ul>
            <li>Harina</li>
            <li>Leche</li>

        </ul>

        <input type="text" placeholder="Tu nombre" required>
        <input type="email" placeholder="Correo" required>

        <br><br>

        <button>Enviar</button>
    </main>

    <footer id="contacto">
        <p>Recetaria 2026</p>
    </footer>

</body>
</html>
